name: Build KnowlesCraft download

on:
  push:
    branches: [main]
    paths:
      - 'fresh-install/**'
      - 'pack.toml'
      - 'setup/FamilyEdition-Enable-AutoUpdates.zip'
      - '.github/workflows/build-fresh-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble Prism import ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist
          mkdir -p build/.minecraft dist bootstrap
          cp fresh-install/instance.cfg build/
          cp fresh-install/mmc-pack.json build/
          cp fresh-install/START-HERE.txt build/
          if [ -d fresh-install/.minecraft ]; then
            cp -a fresh-install/.minecraft/. build/.minecraft/
          fi
          unzip -q setup/FamilyEdition-Enable-AutoUpdates.zip -d bootstrap
          BOOTSTRAP_JAR="$(find bootstrap -type f -name 'packwiz-installer-bootstrap.jar' -print -quit)"
          test -n "$BOOTSTRAP_JAR"
          cp "$BOOTSTRAP_JAR" build/.minecraft/packwiz-installer-bootstrap.jar
          (cd build && zip -qr ../dist/FamilyEdition-Fresh-Install.zip .)
          cp dist/FamilyEdition-Fresh-Install.zip dist/KnowlesCraft-Fresh-Install.zip
          cp dist/FamilyEdition-Fresh-Install.zip dist/KnowlesCraft.zip

      - name: Publish generated ZIP to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/FamilyEdition-Fresh-Install.zip dist/KnowlesCraft-Fresh-Install.zip dist/KnowlesCraft.zip
          if git diff --cached --quiet; then
            echo 'KnowlesCraft ZIP already current.'
            exit 0
          fi
          git commit -m 'Build KnowlesCraft Prism ZIP [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pack.toml", "rb"))["version"])')"
          TAG="v$VERSION"
          cat > build/release-notes.md <<'NOTES'
          Download **KnowlesCraft.zip** below.

          1. In Prism Launcher, choose **Add Instance > Import** and select the ZIP.
          2. Select **KnowlesCraft** and click **Launch**.
          3. In Minecraft, open **Multiplayer** and join **KnowlesCraft**.

          Setup and updates run automatically before Minecraft opens. Allow a few extra minutes the first time.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KnowlesCraft.zip --clobber
            gh release edit "$TAG" --notes-file build/release-notes.md
            echo "Updated the KnowlesCraft download and release notes."
            exit 0
          fi
          gh release create "$TAG" dist/KnowlesCraft.zip --target "$GITHUB_SHA" --title "KnowlesCraft $VERSION" --notes-file build/release-notes.md --latest
